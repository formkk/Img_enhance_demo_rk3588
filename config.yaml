# config.yaml —— RK3588 极暗光增强实时演示系统（唯一运行期配置）
#
# 地位：本文件是主基准 §10.4「config.yaml 键表」的**落盘载体**；键表是唯一 SSOT，
#       本文件**不得出现表外键**（规则 20-contracts.md §1），取值一律以 §10.4 的
#       「取值来源 / 依据」与「定稿时点」两列为准。
# 结构约定：§10.4 的点号键名（`board.model`）在本文件写作**嵌套路径**（board: model:）。
# 状态纪律（§10.4）：
#   - 定稿时点 = M0 的键：**必须零空缺**（空值即未定稿，禁止留默认值顶替）——见
#     docs/evidence/M0-reg-config.md 的逐键勾选表；
#   - 定稿时点晚于 M0 的键：本阶段以 `null` 占位 = **未定稿**（不代表取值未知）；
#   - `provisional` 仅适用于 §10.4 明列的代用数据项 —— 见
#     docs/evidence/M0-reg-provisional.md。
# 纪律：现场运行期**只允许**曝光/增益微调；其余取值由启动时选定，换值 = 改本文件后重启（§10.4、§8.1）。
# 生成时点：2026-09-18（M0 阶段，v3.28 首次落盘；v3.29 同步 O34/O30 裁定后的注释与口径，**键值零改动**）。
# 改动本文件后须同步回写 §10.4 与 §14（规则 00-ssot.md §4）。

# ── 硬件（定稿时点 M0）──────────────────────────────────────────────
board:
  model: "Embedfire LubanCat-5 V2"      # 实测 /proc/device-tree/model（M0-1）
  cam_port: "CAM0"                       # 丝印口；CAM0 = 4 lane（R12）
  cam_lanes: 4
  overlay: "rk3588-lubancat-5-cam0-imx415-1920x1080-60fps-overlay.dtbo"
                                         # uEnvLubanCat5-V2.txt 第 63 行启用；另有 HDMI0-VP0 与
                                         # DSI0-VP2 5.5" 1080x1920 两条 overlay 同时生效（未改动）

# ── 采集（定稿时点 M0）──────────────────────────────────────────────
camera:
  video_node: "/dev/video11"             # rkisp_mainpath，NV12 1920×1080（M0-1 实测）
  rkisp_node: "/dev/media1"              # rkisp0-vir0；口径已裁定（v3.29 裁定 O34-④）= ISP 的
                                         # media 设备（拓扑/子设备控制），采集出口见 camera.video_node
  mainpath_only: true                    # 只开 mainpath，勿开 rawpath（§3.1）
  mode_class: "binning"                  # **（v3.86 定稿，§3.2 第①步）** = IMX415 **Horizontal/Vertical
                                         #   2/2-line binning**（相邻 2×2 相加）：板上**取流中寄存器回读**
                                         #   `0x3020=0x01(HADD)` / `0x3021=0x01(VADD)` / `0x3022=0x01(ADDMODE)` /
                                         #   `0x30D9=0x02` / `0x30DA=0x01`（待机态为默认值 0x00/0x06 ⇒ 判定必须
                                         #   在 s_stream=1 下取）；读出窗口 1944×1096（3864×2192 两轴各半）
                                         #   → 驱动居中裁到 1920×1080。证据 = `docs/evidence/M1-2-isp-mode.md`
                                         #   + `docs/evidence/reports/M1-2/`。**§3.2 第②步（暗部 σ / 拖影
                                         #   对照）未做，登记为 §15 的 O86**；本值**不含任何 SNR 数值主张**
  fps: 15                                # **（v3.86 定稿 O91）帧率档 30 → 15**（§9.5）：演示/采集定稿值
                                         #   = **66 ms + 20×**（0.85 Lux 下人工目视为"细节↔噪声平衡点"）
                                         #   设备树只有
                                         #   1080p@60 的 overlay、`/dev/video11` 无 set-parm 口 ⇒ 只能由
                                         #   sensor subdev 的 `vertical_blanking` 复位帧周期；两点法实测
                                         #   30.0 fps（600/1200 帧）⇒ 满足 §11 M1 出口标准 #1
                                         #   **（v3.86 注）本段为 v3.79 历史留档；现行值见条目头（O91 = 15 fps）**
  vblank_lines: 7906                     # **（v3.86 定稿 O91）15 fps 的机制值**：VMAX = 1080 + 7906
                                         #   = 8986 行 ≈ 66.8 ms（行时 7.433 µs）⇒ ≈15.0 fps
                                         #   （实测 14.78~15.0）；其余机制不变（VMAX =
                                         #   1080 + 3405 = **4485 行** = 1/30 s 的行数（行时 7.433 µs）；
                                         #   由 `sensor_lock.py` 在 STREAMON **之前**写 sensor subdev 并回读
                                         #   校验；**停流即复位 ⇒ 每次启动都要重施**
                                         #   **（v3.86 注）上述 3405 / 4485 行 / 1-30 s 为 v3.79 历史留档；现行值见条目头（O91 = 7906 行 / 15 fps）**
  exposure_us: 66666                     # **（v3.86 定稿 O91）镜像值**——取值 SSOT = **IQ 文件**（v3.77 裁定
                                         #   §9.5 ⑦），本键**仅作审计镜像、不得以本键为准**；1/30 s 在 30 fps
                                         #   锁定下**可达**（sensor subdev 回读：exposure 上限 4493 行，
                                         #   设 4485 行 = 33.33 ms 生效）
                                         # （v3.77 裁定）**取值 SSOT = IQ 文件**（§9.5 ⑦）：固定曝光/增益的
                                         #   **值只写在 IQ 里**（`ae_calib/CommCtrl/AecOpType=MANUAL` +
                                         #   `AecManualCtrl/LinearAE/{TimeValue,GainValue,IspDGainValue}`）
                                         #   ⇒ 本键语义改为「记 IQ 文件名 + sha256 + sensor subdev 实测回读」，
                                         #   **以 IQ 为准**（本键的值是**镜像**，仅供审计与闸门"零空缺"判定）；
                                         #   `camera.gain_*` 同此（**子键名已于 v3.86 随 `v4l2-ctl -L` 实测定稿**，见下）
  # `camera.gain_*`（**v3.86 定稿：子键名随 `v4l2-ctl -L` 实测定义** —— v3.29 裁定 O34-③ 的执行）
  # 实测口径：板端 **sensor subdev `/dev/v4l-subdev2`**、**取流中** `v4l2-ctl -L`（只读）——
  #   该 subdev 上**唯一的增益控制** = `analogue_gain`（无独立数字增益口）；`exposure`
  #   范围 4..8994、步进 1，**max = VMAX + 8 = 8986 + 8 = 8994**（与 vblank 7906 自洽）。
  # 换算：**每步 0.3 dB**（§9.5 ②）⇒ `reg = 20·log10(gain)/0.3`；**三个实测点逐点自洽**：
  #   4.0× → 40（v3.77 实测）/ 8.0× → 60（v3.83 定稿）/ 20.0× → 86.7 → **87**（O91 定稿）。
  gain_ctrl: "analogue_gain"             # 控制名（subdev 上唯一增益控制）
  gain_min: 0
  gain_max: 240                          # = 72 dB ≈ 3981×（按上式反解）
  gain_step: 1                           # 寄存器步进
  gain_db_per_step: 0.3                  # 每步 0.3 dB（§9.5 ②）
  gain_linear: 20.0                      # **【镜像值】**线性倍数（**取值 SSOT = IQ**；O91 定稿）
  gain_reg: 87                           # **【镜像值】**subdev 实测回读（= 26.02 dB = 20×）

# ── ISP（**v3.86 定稿 O145：本域 5 键全部定稿**；定稿时点 M1）─────────────
# 两套档位（O62=(b)）：采集档 / 演示档 = 两套 IQ 文件，各自记文件名 + sha256，采集工具启动
#   校验"当前 IQ = 采集档"，否则拒采（v3.77 已实施）。两套由 `tools/collect/iq_sets.py`
#   生成 / 切换，落在 `/etc/iqfiles_sets/`（stock/ + collect/ + demo/ + manifest.json）；
#   防呆落地于 `capture_app.py`（`--iq-manifest`，fail-closed）。
isp:
  presets:                               # 【M1 定稿 · v3.86 O145】三套预设（§9.2、§9.5）
    darkroom:                            # 暗房（静物）
      scene: "暗房（静物）"
      exposure_us: 66666                 # 起点 = O91 定稿的 66 ms（三档同值）
      gain: 20.0                         # 线性倍数（sensor 模拟段）
      fps: 15
      iq_set: "demo"
      nr_3d: "IQ 现值（enable=0）"         # 2026-10-05 起：演示档（与采集档同为 3DNR 关）
    night:                               # 夜景
      scene: "夜景"
      exposure_us: 66666
      gain: 20.0
      fps: 15
      iq_set: "demo"
      nr_3d: "IQ 现值（enable=0）"         # 2026-10-05 起：演示档（与采集档同为 3DNR 关）
    face:                                # 弱光人脸
      scene: "弱光人脸"
      exposure_us: 66666
      gain: 20.0
      fps: 15
      iq_set: "demo"
      nr_3d: "IQ 现值（enable=0）"         # 2026-10-05 起：演示档（与采集档同为 3DNR 关）
    note: >-
      取值 SSOT = IQ 文件（§9.5 ⑦）：本表数值是**镜像 + 依据**，生效值只写在 IQ 里（档位文件
      与 sha256 见本域 `fingerprint.iq_*`）。⚠️ **本轮三档同值**（用户 2026-09-23 选定：曝光/
      增益起点统一用 O91 的 66 ms / 20×，NR 档只回读不改）⇒ **R23（高照度过曝风险）的分场景
      缓解尚未落地**，随 M2 通路可用后的观感终审（§9.5 O94 两段式）。运行期只许曝光/增益微调，
      换预设 = 改 config 后重启（v3.9 裁定 O10）；换 `iq_set` 须重启 `rkaiq_3A`（O62 ④(ii)）。
  fingerprint:                           # 【M1 定稿 · v3.86 O145】§9.5 ISP 指纹（8 子项）
    # 记录口径：只记「IQ 内路径 + 可观测状态 + 规范化子树哈希」，**不复制 IQ 取值**
    #   （SSOT = IQ 文件，规则 00-ssot.md §3.1）；子树哈希 = 对 IQ 中该子树做
    #   `json.dumps(sort_keys=True, separators=(',',':'))` 后取 sha256，**此处记前 16 位十六进制**。
    # 场景树路径 = `main_scene[i].sub_scene[0].scene_isp30`（i = 0 / 1，两棵同构；下标随行注明）。
    iq_file: "imx415_CMK-OT2022-PX1_IR0147-50IRC-8M-F20.json"
    iq_hash:
      stock: "4536f96a0bd594ed803c7a611aa928105c5be8903549b9b269a0e2b4764fa6e0"
      # **（2026-09-29 回写 / O64 收口）两套已重建 = 锁 AWB**（`wb_v21.control.mode =
      #   CALIB_WB_MODE_MANUAL` + `manualPara.cfg.mwbGain = [1.32703,1,1,3.31432]`）；
      #   除 `wb_v21` 外其余子树**逐位未变**（gamma/ccm/blc/nr_2d/dpc 与 stock 一致、
      #   **2026-10-05 起两档 `nr3d_enable` 均为 0 ⇒ 两档实际内容等价，差异只剩 sha / `built_utc`；
      #   `O62=(b)` 两套档位的去留见 §15 O157（待裁定）；原「`nr_3d` 为两档唯一 ISP 差异」作废**）。
      collect: "81e61da407ef1846858fcf68a50885f50fed9f5f0bfc720720db1c31fb315585"
      demo: "ab19ae2a26177971768a0287204da6d71e574cbfdff4fc9e21d5f22b718d23c9"
      # **（2026-10-05 起）** 演示档 IQ 关闭 3DNR（`bayertnr_v2/TuningPara/enable` 1→0）后的档位库／加载点
      #   一致 sha；manifest `sets.demo.sha256` 已更新为该值、`nr3d_enable` 由 `[1]` 改为 `[0]`（详见 §14 追加 190）。
      # ⚠️ 换档前 `/etc/iqfiles/` 仍驻留**旧 demo 档**（`2ed58401…`，进程内已加载）⇒ `iq_sets.py status`
      #   此时报 `unknown`（该哈希已不在任何档）；采集前 `switch collect`、收尾 `switch demo` 即落到新哈希。
    gamma_table:
      src: "agamma_calib_v11/GammaTuningPara"
      gamma_en: 1                        # 进 gamma 开（重量级杠杆，本轮不动）
      curve_points: 49                   # Gamma_curve 长度
      gamma_out_offset: 0
      curve_sha256_16: "6c8b16cfbcc298d9"
      subtree_sha256_16: "881b76242a6f2650"   # stock / collect / demo 三者一致
      degamma_en: 0                      # 旁证：进 gamma 前无反 gamma（adegamma_calib）
    ccm:
      src: "ccm_calib"
      enable: 1                          # ccm_calib/control.enable
      matrices: 14                       # TuningPara/matrixAll 条数
      illuminants: 7                     # TuningPara/aCcmCof 条数
      damp_enable: 1
      interp_enable: 0                   # illu_estim 不插值
      default_illu: "A"
      tuning_sha256_16: "85e5727b30c11272"
    black_level:
      src: "ablc_calib"
      enable: 1                          # BlcTuningPara（BLC_Data = 13 个 ISO 点 × R/Gr/Gb/B）
      enable_set2: 0                     # Blc1TuningPara（第二组未启用）
      iso_points: 13
      tuning_sha256_16: "a511de7cb4e7c348"
    awb_lock: "manual"                   # **（2026-09-29 回写；O64 收口）** `wb_v21.control.mode =
                                         #   CALIB_WB_MODE_MANUAL`、`manualPara.mode = CALIB_MWB_MODE_WBGAIN`、
                                         #   `mwbGain = [1.32703, 1, 1, 3.31432]`（IQ 内既有手动预设）；
                                         #   **两套 IQ 均锁**（采集档 + 演示档）⇒ §9.5 ⑤ 的「AWB 锁定」落地。
                                         #   ⚠️ 效力边界：取值来源 = IQ 既有手动预设、**非本地场景标定**；
                                         #   「改光源色温后 WB 增益不动」的板端观测未做（残留，见 §15 O64）
    nr_2d:
      src: "bayer2dnr_v2/TuningPara.enable"
      enable: 1                          # demo / collect 一致
      tuning_sets: 2                     # LSNR/lcg、HSNR/hcg
      iso_points: 13
      tuning_sha256_16: "16ee259977494109"
    nr_3d:
      src: "bayertnr_v2/TuningPara.enable"
      enable: {demo: 0, collect: 0}      # **2026-10-05 起两档 `nr3d_enable` 均为 0 ⇒ 两档实际内容等价，差异只剩 sha / `built_utc`；`O62=(b)` 两套档位的去留见 §15 O157（待裁定）**
      tuning_sets: 2
      iso_points: 13
      tuning_sha256_16:                  # 按 [isp30[0], isp30[1]]
        demo: ["3231321eaddd45e7", "31be6ead629da008"]   # 2026-10-05 **实算**（非猜测）：子树 = `bayertnr_v2.TuningPara`；口径经「以 collect 已知值反推」验证 —— 同口径可精确复现 collect 的已知值 ⇒ 可信；demo 与 collect 的 TuningPara 现已等价（两者 enable 均为 0）
        collect: ["3231321eaddd45e7", "31be6ead629da008"]   # 仅 enable 翻 0
    dpc:
      src: "adpcc_calib/DpccTuningPara/Enable"
      enable: 1
      subtree_sha256_16: ["79da0940d59eea65", "534d9be12f2cc92c"]
  csc_matrix: "bt601"                    # 【M1 定稿 · v3.86 O145】RGA 侧 NV12→RGB 的 CSC：
                                         #   §9.5 ⑨ 实测 ISP 侧 `YRangeMode = FULL` ⇒ 配 full；
                                         #   取值与 native/rga_core.c 的 `IM_YUV_TO_RGB_BT601_FULL`
                                         #   一致（非猜测）。取值域（实现侧）= `bt601` / `bt709`，
                                         #   见 native/realtime_apply_pybind.cpp `parse_csc()`
  rgb_range: "full"                      # 【M1 定稿 · v3.86 O145】取值域 = `limited` / `full`
  nr_3d_ref_frames:                      # 【M1 定稿 · v3.86 O145】§9.5 v3.4 追加② 的落地口径
    # ⚠️ **取值对象已修订（O145）**：「参考帧数」在 IQ、厂商头文件、`librkaiq.so` 三处**均不存在**
    #    （`bayertnr_v2` 只暴露 `enable` + 2 组 `Setting` × 13 ISO 点 = 17 字段，无任何 ref/frame 字段）
    #    ⇒ 不以猜测值填充；本键改记「3DNR 时域项的**可回读状态** + 其**帧级固有延迟的 A/B 实测**」。
    src: "bayertnr_v2/TuningPara"
    enable: {demo: 0, collect: 0}    # 2026-10-05：demo 档 `bayertnr_v2.enable` 已改 0（§14 追加 190）
    ref_frames: "IQ 未暴露（不得猜值）"
    ab:                                  # 3DNR 开 / 关 同场景 A/B（各 3 轮 × 300 帧，idle-link）
      reports: ["docs/evidence/reports/M1-5/idle_3dnr_on.json",
                "docs/evidence/reports/M1-5/idle_3dnr_off.json",
                "docs/evidence/reports/M1-5/idle_3dnr_off2.json"]
      submit_to_vblank_ms:               # **三份一致** ⇒ 显示侧无固有延迟
        p50: [8.887, 8.980, 8.698]
        p95: [16.156, 16.156, 16.215]
      capture_to_submit_ms:
        p50: [4.643, 7.366, 3.558]       # ⚠️ 抖动 ±2 ms > 两档差异（OFF#1 的 +2.7 不复现）
      conclusion: "未检出可归因于 3DNR 时域滤波的帧级固有延迟（提交→vblank 三份一致、极差 ≤0.3 ms）；\n        「采集→提交」段的锚点 = 驱动 EOF 事件，其时序随 ISP 处理次序移动，且跨运行抖动大于两档\n        差异 ⇒ 不得由延迟差反推参考帧数。证据档 = docs/evidence/M1-5-isp-presets.md §4。"

# ── 图像（定稿时点 M0）──────────────────────────────────────────────
rga:
  core_mask: 3                           # = IM_SCHEDULER_RGA3_CORE0 | CORE1（M0-13 实测落定）

# ── 显示（定稿时点 M0，除末项）──────────────────────────────────────
display:
  screen_plugin: "mipi600p"              # v3.33 变更（原 mipi1080p）：实物为 7" 1024×600 屏（STL7.0-60-132-K）
  dsi_connector: "DSI-1"                 # 自检比对用；CRTC/plane 一律运行时解析，禁止写死 crtc id
  hdmi_connector: "HDMI-A-1"             # 自检比对用；当前实测 disconnected（M0-9 需接显示器）
  mipi_canvas: [1024, 600]               # 合成画布（§3.4；v3.33 变更，横屏 7"）；v3.85 裁定 O82：语义不变
  hdmi_canvas: [1920, 1080]              # **镜像画布**（§3.1/§3.5；v3.85 裁定 O78/O82：语义由"HQ 独占的内部
                                         #   合成画布"改为"镜像画布"，尺寸不变 1920×1080 = 两层 SSOT 的 buffer 尺寸）；
                                         #   常规态 = MIPI 画布经 RGA 每帧放大 1.875×、HQ 态 = 集合 D 放大 2.0×
  panel_refresh_hz: 60                   # 实测 1024x600p60（dclk 51668000；51668000/(1354×636)=60.00 Hz）
  mode_htotal: 1354                      # 实测 modetest #0：1024 1184 1194 1354（=1024+160+10+160）
  mode_vtotal: 636                       # 实测 modetest #0：600 612 613 636（=600+12+1+23）
  dsi_lane_rate: 344                     # Mbit/s/lane，dmesg 实测 "DSI-Link bandwidth: 344453 x 4 Kbps"
  hdmi_mode_selection: "edid_prefer_1080p" # 【M2-1 定稿】EDID mode list 优先 1080p，无则 preferred（§10.4）
                                             # v3.48 裁定 O49：由 M2 移入 M2-1（需 EDID ⇒ 需 HDMI 显示器接入）
                                             # v3.83 定稿：实测 EDID modes 首位 = 1920x1080，运行时亦落在 1080p（见证据档 §18.4）

# ── 链路（定稿时点见各行）───────────────────────────────────────────
pipeline:
  curve_level: "480x272"                 # 【provisional】§10.4 明列的代用数据项（O7），M1 实拍集复检转 final
                                         # 三档 shape 表 = 256x144 / 480x272 / 960x544，由本键与
                                         # curve_geometry 共同承载（§10.4 该行与 §3.1）
  curve_geometry:                        # 定稿时点 M0（§3.1 契约 G1；v3.27 裁定 O32 后的机制）
    effective:                           # 有效区（网络输出只取此区，pad 行丢弃）
      "256x144": [256, 144]
      "480x272": [480, 270]
      "960x544": [960, 540]
    pad_to:                              # 模型 shape（256×144 严格 16:9，无 pad）
      "256x144": [256, 144]
      "480x272": [480, 272]
      "960x544": [960, 544]
    pad_fill: "zero"                     # 零填充（v3.10 裁定 O20）
    pad_mechanism: "rga_improcess_zero_source_at_pool_init"
                                         # 缓冲池初始化时各填一次（0.45 ms/缓冲）+ 每帧一次
                                         # scale+CSC blit（不越写 pad 行）（v3.27 裁定 O32）
    output_take: "effective_only"
  curve_field_precision: "fp16"          # 【临时期值】v3.22 裁定 O23 = 全档 FP16；定稿时点 M2
  apply_scope: {display: [512, 288]}
                                         # 【M2 定稿】§3.1：曲线应用只做到窗分辨率（**v3.86 裁定 O102**：
                                         #   原 `save: [1920, 1080]` 子项随「存图」整体取消而移除）
  curve_upsample: "bilinear_fused"        # 【M2 定稿】双线性 + 融合进 8iter 单遍（**O102**：原"显示域与
                                         #   存盘域同策"的存盘域已取消，显示域口径不变）（§3.1 I1）
  est_freq_hz: 7.53                      # 【M2 定稿·实测；**v3.86 裁定 O103 更新**】est_every=2 下实测
                                         #   **7.527 Hz**（§11 M2 要求 5~15 Hz）；原值 9.5 Hz 是 **30 fps 时代**
                                         #   的镜像（O91 改 15 fps 后未重推，即 O103 的根因）
  ema_alpha: 0.4642                      # 【M2 定稿·实测】§9.1：N=ln(0.1)/ln(α)=3 ⇒ 收敛 3/7.527=398.6 ms
                                         #   ≤400 ms（**O103**：该值只在 f_est≈7.5 Hz 下成立；f_est=2.5 Hz
                                         #   时为 1201.6 ms ⇒ 拖影）

