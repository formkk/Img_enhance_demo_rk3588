# config.yaml —— RK3588 极暗光增强实时演示系统（唯一运行期配置）
#
# 地位：本文件是主基准 §10.4「config.yaml 键表」的**落盘载体**；键表是唯一 SSOT，
#       本文件**不得出现表外键**（规则 20-contracts.md §1），取值一律以 §10.4 的
#       「取值来源 / 依据」与「定稿时点」两列为准。
# 结构约定：§10.4 的点号键名（`board.model`）在本文件写作**嵌套路径**（board: model:）。
# 状态纪律（§10.4）：
#   - 定稿时点 = M0 的键：**必须零空缺**（空值即未定稿，禁止留默认值顶替）——见
#     docs/evidence/M0-reg-config.md 的逐键勾选表；
#   - 定稿时点晚于 M0 的键：本阶段以 `null` 占位 = **未定稿**（不代表取值未知）；
#   - `provisional` 仅适用于 §10.4 明列的代用数据项 —— 见
#     docs/evidence/M0-reg-provisional.md。
# 纪律：现场运行期**只允许**曝光/增益微调；其余取值由启动时选定，换值 = 改本文件后重启（§10.4、§8.1）。
# 生成时点：2026-09-18（M0 阶段，v3.28 首次落盘；v3.29 同步 O34/O30 裁定后的注释与口径，**键值零改动**）。
# 改动本文件后须同步回写 §10.4 与 §14（规则 00-ssot.md §4）。

# ── 硬件（定稿时点 M0）──────────────────────────────────────────────
board:
  model: "Embedfire LubanCat-5 V2"      # 实测 /proc/device-tree/model（M0-1）
  cam_port: "CAM0"                       # 丝印口；CAM0 = 4 lane（R12）
  cam_lanes: 4
  overlay: "rk3588-lubancat-5-cam0-imx415-1920x1080-60fps-overlay.dtbo"
                                         # uEnvLubanCat5-V2.txt 第 63 行启用；另有 HDMI0-VP0 与
                                         # DSI0-VP2 5.5" 1080x1920 两条 overlay 同时生效（未改动）

# ── 采集（定稿时点 M0）──────────────────────────────────────────────
camera:
  video_node: "/dev/video11"             # rkisp_mainpath，NV12 1920×1080（M0-1 实测）
  rkisp_node: "/dev/media1"              # rkisp0-vir0；口径已裁定（v3.29 裁定 O34-④）= ISP 的
                                         # media 设备（拓扑/子设备控制），采集出口见 camera.video_node
  mainpath_only: true                    # 只开 mainpath，勿开 rawpath（§3.1）
  mode_class: "binning"                  # **（v3.86 定稿，§3.2 第①步）** = IMX415 **Horizontal/Vertical
                                         #   2/2-line binning**（相邻 2×2 相加）：板上**取流中寄存器回读**
                                         #   `0x3020=0x01(HADD)` / `0x3021=0x01(VADD)` / `0x3022=0x01(ADDMODE)` /
                                         #   `0x30D9=0x02` / `0x30DA=0x01`（待机态为默认值 0x00/0x06 ⇒ 判定必须
                                         #   在 s_stream=1 下取）；读出窗口 1944×1096（3864×2192 两轴各半）
                                         #   → 驱动居中裁到 1920×1080。证据 = `docs/evidence/M1-2-isp-mode.md`
                                         #   + `docs/evidence/reports/M1-2/`。**§3.2 第②步（暗部 σ / 拖影
                                         #   对照）未做，登记为 §15 的 O86**；本值**不含任何 SNR 数值主张**
  fps: 15                                # **（v3.86 定稿 O91）帧率档 30 → 15**（§9.5）：演示/采集定稿值
                                         #   = **66 ms + 20×**（0.85 Lux 下人工目视为"细节↔噪声平衡点"）
                                         #   设备树只有
                                         #   1080p@60 的 overlay、`/dev/video11` 无 set-parm 口 ⇒ 只能由
                                         #   sensor subdev 的 `vertical_blanking` 复位帧周期；两点法实测
                                         #   30.0 fps（600/1200 帧）⇒ 满足 §11 M1 出口标准 #1
                                         #   **（v3.86 注）本段为 v3.79 历史留档；现行值见条目头（O91 = 15 fps）**
  vblank_lines: 7906                     # **（v3.86 定稿 O91）15 fps 的机制值**：VMAX = 1080 + 7906
                                         #   = 8986 行 ≈ 66.8 ms（行时 7.433 µs）⇒ ≈15.0 fps
                                         #   （实测 14.78~15.0）；其余机制不变（VMAX =
                                         #   1080 + 3405 = **4485 行** = 1/30 s 的行数（行时 7.433 µs）；
                                         #   由 `sensor_lock.py` 在 STREAMON **之前**写 sensor subdev 并回读
                                         #   校验；**停流即复位 ⇒ 每次启动都要重施**
                                         #   **（v3.86 注）上述 3405 / 4485 行 / 1-30 s 为 v3.79 历史留档；现行值见条目头（O91 = 7906 行 / 15 fps）**
  exposure_us: 66666                     # **（v3.86 定稿 O91）镜像值**——取值 SSOT = **IQ 文件**（v3.77 裁定
                                         #   §9.5 ⑦），本键**仅作审计镜像、不得以本键为准**；1/30 s 在 30 fps
                                         #   锁定下**可达**（sensor subdev 回读：exposure 上限 4493 行，
                                         #   设 4485 行 = 33.33 ms 生效）
                                         # （v3.77 裁定）**取值 SSOT = IQ 文件**（§9.5 ⑦）：固定曝光/增益的
                                         #   **值只写在 IQ 里**（`ae_calib/CommCtrl/AecOpType=MANUAL` +
                                         #   `AecManualCtrl/LinearAE/{TimeValue,GainValue,IspDGainValue}`）
                                         #   ⇒ 本键语义改为「记 IQ 文件名 + sha256 + sensor subdev 实测回读」，
                                         #   **以 IQ 为准**（本键的值是**镜像**，仅供审计与闸门"零空缺"判定）；
                                         #   `camera.gain_*` 同此（子键名仍随 M1 定义）
  # `camera.gain_*`：§10.4 为**通配键名**（"实测重标结构"），**子键名未定** ⇒ 无法落盘
  # （禁止自造表外键，规则 20-contracts.md §1）。**v3.29 裁定 O34-③**：该行定稿时点 = **M1**
  # ⇒ 子键名随 M1 的 `v4l2-ctl -L` 实测一并定义；不参与 §11.2 M0-② 的判定

# ── ISP（定稿时点 M1）───────────────────────────────────────────────
isp:
  presets: null                          # 暗房 / 夜景 / 人脸（§9.2、§9.5）
                                         # （v3.75 裁定 O62=(b)）采集档 / 演示档 = 两套 IQ 文件，
                                         #   各自记文件名+sha256，采集工具启动校验"当前IQ=采集档"，否则拒采
                                         # （v3.77 已实施）两套由 `tools/collect/iq_sets.py` 生成/切换，
                                         #   落在 /etc/iqfiles_sets/（stock/ + collect/ + demo/ + manifest.json）；
                                         #   防呆已落地于 capture_app.py（--iq-manifest，fail-closed）
  fingerprint: null                      # iq_file+iq_hash / gamma_table / ccm / black_level /
                                         # awb_lock / nr_2d / nr_3d / dpc（§9.5）
  csc_matrix: null                       # 定稿时点 M1（BT.601/709）
  rgb_range: null                        # 定稿时点 M1（limited/full）
  nr_3d_ref_frames: null                 # 定稿时点 M1

# ── 图像（定稿时点 M0）──────────────────────────────────────────────
rga:
  core_mask: 3                           # = IM_SCHEDULER_RGA3_CORE0 | CORE1（M0-13 实测落定）

# ── 显示（定稿时点 M0，除末项）──────────────────────────────────────
display:
  screen_plugin: "mipi600p"              # v3.33 变更（原 mipi1080p）：实物为 7" 1024×600 屏（STL7.0-60-132-K）
  dsi_connector: "DSI-1"                 # 自检比对用；CRTC/plane 一律运行时解析，禁止写死 crtc id
  hdmi_connector: "HDMI-A-1"             # 自检比对用；当前实测 disconnected（M0-9 需接显示器）
  mipi_canvas: [1024, 600]               # 合成画布（§3.4；v3.33 变更，横屏 7"）；v3.85 裁定 O82：语义不变
  hdmi_canvas: [1920, 1080]              # **镜像画布**（§3.1/§3.5；v3.85 裁定 O78/O82：语义由"HQ 独占的内部
                                         #   合成画布"改为"镜像画布"，尺寸不变 1920×1080 = 两层 SSOT 的 buffer 尺寸）；
                                         #   常规态 = MIPI 画布经 RGA 每帧放大 1.875×、HQ 态 = 集合 D 放大 2.0×
  panel_refresh_hz: 60                   # 实测 1024x600p60（dclk 51668000；51668000/(1354×636)=60.00 Hz）
  mode_htotal: 1354                      # 实测 modetest #0：1024 1184 1194 1354（=1024+160+10+160）
  mode_vtotal: 636                       # 实测 modetest #0：600 612 613 636（=600+12+1+23）
  dsi_lane_rate: 344                     # Mbit/s/lane，dmesg 实测 "DSI-Link bandwidth: 344453 x 4 Kbps"
  hdmi_mode_selection: "edid_prefer_1080p" # 【M2-1 定稿】EDID mode list 优先 1080p，无则 preferred（§10.4）
                                             # v3.48 裁定 O49：由 M2 移入 M2-1（需 EDID ⇒ 需 HDMI 显示器接入）
                                             # v3.83 定稿：实测 EDID modes 首位 = 1920x1080，运行时亦落在 1080p（见证据档 §18.4）

# ── 链路（定稿时点见各行）───────────────────────────────────────────
pipeline:
  curve_level: "480x272"                 # 【provisional】§10.4 明列的代用数据项（O7），M1 实拍集复检转 final
                                         # 三档 shape 表 = 256x144 / 480x272 / 960x544，由本键与
                                         # curve_geometry 共同承载（§10.4 该行与 §3.1）
  curve_geometry:                        # 定稿时点 M0（§3.1 契约 G1；v3.27 裁定 O32 后的机制）
    effective:                           # 有效区（网络输出只取此区，pad 行丢弃）
      "256x144": [256, 144]
      "480x272": [480, 270]
      "960x544": [960, 540]
    pad_to:                              # 模型 shape（256×144 严格 16:9，无 pad）
      "256x144": [256, 144]
      "480x272": [480, 272]
      "960x544": [960, 544]
    pad_fill: "zero"                     # 零填充（v3.10 裁定 O20）
    pad_mechanism: "rga_improcess_zero_source_at_pool_init"
                                         # 缓冲池初始化时各填一次（0.45 ms/缓冲）+ 每帧一次
                                         # scale+CSC blit（不越写 pad 行）（v3.27 裁定 O32）
    output_take: "effective_only"
  curve_field_precision: "fp16"          # 【临时期值】v3.22 裁定 O23 = 全档 FP16；定稿时点 M2
  apply_scope: {display: [512, 288]}
                                         # 【M2 定稿】§3.1：曲线应用只做到窗分辨率（**v3.86 裁定 O102**：
                                         #   原 `save: [1920, 1080]` 子项随「存图」整体取消而移除）
  curve_upsample: "bilinear_fused"        # 【M2 定稿】双线性 + 融合进 8iter 单遍（**O102**：原"显示域与
                                         #   存盘域同策"的存盘域已取消，显示域口径不变）（§3.1 I1）
  est_freq_hz: 7.53                      # 【M2 定稿·实测；**v3.86 裁定 O103 更新**】est_every=2 下实测
                                         #   **7.527 Hz**（§11 M2 要求 5~15 Hz）；原值 9.5 Hz 是 **30 fps 时代**
                                         #   的镜像（O91 改 15 fps 后未重推，即 O103 的根因）
  ema_alpha: 0.4642                      # 【M2 定稿·实测】§9.1：N=ln(0.1)/ln(α)=3 ⇒ 收敛 3/7.527=398.6 ms
                                         #   ≤400 ms（**O103**：该值只在 f_est≈7.5 Hz 下成立；f_est=2.5 Hz
                                         #   时为 1201.6 ms ⇒ 拖影）

# ── HQ（定稿时点 M2-2，除 shape_ladder；v3.48 裁定 O49 由 M0 顺延）──────────
hq:
  model_id: null                         # ❌ 空缺：依赖 O30（v3.29 裁定为「暂时挂起」）⇒ 保持空缺，
                                         # 不得以默认值顶替；重启条件见 §15 O30
                                         # 定稿时点 **M2-2**（v3.48 裁定 O49：随 §11.1-4/-12 顺延）
  shape_ladder: ["960x544", "768x432", "512x288"]
                                         # 定稿时点 M0（取值不受 O49 影响，§10.4 既定梯度）
  active_shape: "960x544"                 # v3.58 裁定 O37：取值已定 = 960x544（画质优先；实测 10014 ms / mask=4 10548.8 ms，内存 ≈2.7 GB）
                                          #   定稿时点仍为 **M2-2**（v3.48 裁定 O49）；若 M2-2 的 O30 改用保底 CNN，本值须按新模型重评
  pad_crop_policy: null                  # ❌ 空缺：随 active_shape 一并定版（同上）
                                         # 定稿时点 **M2-2**（v3.48 裁定 O49）
                                         # v3.85 裁定 O82：`hq.hold_policy` / `hq.fade_ms` / `hq.mipi_preview_ms` /
                                         #   `hq.mipi_preview_rect` **四键取消**（"替换保持 / 淡入 / 弹层"对象消失，
                                         #   见 §3.5 与 §15 的 O67/O68/O82）⇒ 本域**不再有该四键**

# ── 触发（定稿时点 M2-2，v3.84 裁定 O73 由 M1 前移）──────────────────
trigger:
  debounce_ms: 50                        # 【M2-2 定稿】消抖窗；**v3.85 裁定 O82：依据由"§8.1 GPIO 消抖"改为
                                         #   "指针点击防连发"**（§3.4；§11.2 M2 ① 引用该值）
                                         # v3.85 裁定 O82：`trigger.sources` / `trigger.interval_s` **两键取消**
                                         #   （触发源收敛为**单源：指针点击**，无选择空间/无消费者；O73 所定的
                                         #   四源取值随之作废）⇒ 本域仅剩 `debounce_ms` 一键

# ── UI（定稿时点 M2）───────────────────────────────────────────────
ui:
  button_layout:                         # 【M2 定稿】§3.4：按钮区 1024×96（Y 504-599），2 键单行各 512 px
                                         #   （v3.86 裁定 O101：取消 save 键、两键各 512）
    rows: 1
    height_px: 90                          # **v3.86 裁定 O111：93 → 90**（累计吸收图示下移的 6 px；O109 先 96 → 93）
    keys: [{name: trigger_hq, x: 0, w: 512}, {name: reset_exit, x: 512, w: 512}]
  hit_area_min_px: 67                    # 【M2 定稿】v3.33 变更（原 160）；≈10 mm @170 PPI
  reset_hold_ms: 3000                    # 【M2 定稿】v3.14 裁定 O6：长按 ≥3 s 退出进程
  osd_metrics_px: 222                    # 【M2 定稿】v3.33：OSD 指标区总高；**v3.86 裁定 O111：219 → 222**
                                         #   （状态行 36 + **图示上间隔 6** + 图示 180；O109 先 3 px、O111 再加 3 px）
  osd_status_row_px: 36                  # 【M2 定稿】v3.33：状态/数值行高
  osd_plot_px: [512, 180]                # 【M2 定稿】v3.33：曲线图与直方图各占
  osd_status_fields: [latency, fps, mean_orig, mean_enh]
                                         # 【M2 定稿】v3.35：状态行字段与顺序；**v3.85 裁定 O84：8 → 7 字段
                                         #   （删 countdown）**——TIMER 已移除，见 §3.4 / §13；
                                         #   **v3.86 裁定 O107：7 → 6 字段（删 mode）**——「运行模式」是状态量
                                         #   而非量测值、常态恒为 `RUN_DEMO`；
                                         #   **v3.86 裁定 O108：6 → 5 字段（删 curve_hz）**——本屏是**演示界面**
                                         #   而非系统监控界面，曲线 Hz 属运维/诊断量；**且字段顺序改为
                                         #   延迟在前、帧率在后**（屏上渲染顺序以 §3.4 为 SSOT）；
                                         #   **v3.86 裁定 O109：5 → 4 字段（删 dmean）**——亮度增益改为**屏上不显示**
                                         #   （日志与 bench 报告不受影响）；同裁定：各字段拉开间隔 + 分色 + 「帧率：」中文标签
  osd_stats_decimate: 4                  # 【M2 定稿】v3.35：统计降采样率（512×288 → 128×72 = 9,216 样本）
  osd_stats_hz: 1                        # 【M2 定稿】v3.35：统计更新频率
  osd_font_px: [36, 26]                  # 【M2 定稿】状态行 36 px / 次行 26 px
  fullscreen_timeout_ms: 30000           # 【v3.85 新增·裁定 O79】全屏 HQ 视图无操作 30 s 兜底退出（§3.5）
  pointer_mouse_node: /dev/input/event7    # 【v3.85 新增·裁定 O81；**v3.86 落值**】鼠标 evdev 设备路径；
                                         #   触控节点沿用既有实现口径（`pointer.py` 模块常量 `/dev/input/event2`）
                                         #   取值依据 = 板端 `/proc/bus/input/devices` **只读枚举**：
                                         #   `TESORO H3E  Gaming Mouse`（Phys=usb-1.3/input0）的 Handlers 为
                                         #   **`event7`**，其 EV=17（含 EV_REL）、REL=1943、KEY 含 BTN_LEFT
                                         #   ⇒ 唯一满足"相对位移 + 左键"的鼠标节点；同名设备的 `event11`
                                         #   为 Phy=usb-1.3/input1 的 EV_ABS 节点（**无 EV_REL**）⇒ **不取**
                                         #   （枚举原文见 `docs/evidence/M2-2-hq-align.md` §8.9）

# ── 计量（定稿时点 M1/M2）──────────────────────────────────────────
metrics:
  # 【M2 定稿（v3.86 追加 95）】以下四键**语义 = 期望值 / 断言值**（§6.5）：
  #   报告须与键值一致；键为空即不得出报告（§10.4「空值 = 未定稿」）。
  #   `timestamp_source` 为**期望来源**，运行期实测偏离 ⇒ 按 `capture/timestamp_source_changed`
  #   作废窗并随报告注明（**不新增事件 / 返回码**）。
  window_frames: 300                     # 【M2 定稿（v3.86 追加 95）】§6.5 判定滑窗下界；<300 ⇒ 该轮报告无效
  timestamp_domain: MONOTONIC            # 【M2 定稿（v3.86 追加 95）】唯一合法时钟域（CLOCK_MONOTONIC）
  timestamp_source: EOF                  # 【M2 定稿（v3.86 追加 95）】期望来源；偏离即作废窗
  pair_by: seq                           # 【M2 定稿（v3.86 追加 95）】配对唯一方式；禁时间就近配对
  report_breakdown: true                 # 【M2 定稿】§6.5：延迟两段分解随报告给出
  # 【M1 定稿】空链路基线（§6.1 的 v3.4「必读」段；O19 的触发判据载体）。
  #   **落盘形态 = 位置化数列（ms），次序固定**：
  #     [端到端 P50, 端到端 P95, 采集→提交 P50, 采集→提交 P95, 提交→vblank P50, 提交→vblank P95]
  #   （§10.4 该行；不用字典是因为 config 的叶子键不得出现表外子键 ⇒ 用位置化数列，次序在此写明）。
  #   口径 = 关 TH2a / TH2b / OSD，只跑「采集 → RGA 原图窗 → 画布合成 → pageflip」（`main.py --idle-link`）；
  #   复现 = `bench.py --scenario idle-link --breakdown`，300 帧 × 3 轮（n=900，配对率 1.0000，丢弃 0）；
  #   时序口径 = `mono_ns`，时间戳源 = **EOF**（§6.5；`metrics.timestamp_source` 仍属 M1 未定稿项，本值为 EOF 口径）；
  #   依据报告 = `docs/evidence/reports/O19/idle_link_300x3.json`；实测面板刷新周期 16.667 ms；**不得与常态轮混填**。
  idle_link_baseline: [17.538, 25.670, 9.165, 9.860, 8.768, 16.222]   # O19 判定 = P95 25.67 < 60 ⇒ **不触发** §13 重议

# ── 存储（**v3.86 裁定 O102：本域整域取消**）────────────────────────────
