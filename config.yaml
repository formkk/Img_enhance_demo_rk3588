# config.yaml —— RK3588 极暗光增强实时演示系统（唯一运行期配置）
#
# 地位：本文件是主基准 §10.4「config.yaml 键表」的**落盘载体**；键表是唯一 SSOT，
#       本文件**不得出现表外键**（规则 20-contracts.md §1），取值一律以 §10.4 的
#       「取值来源 / 依据」与「定稿时点」两列为准。
# 结构约定：§10.4 的点号键名（`board.model`）在本文件写作**嵌套路径**（board: model:）。
# 状态纪律（§10.4）：
#   - 定稿时点 = M0 的键：**必须零空缺**（空值即未定稿，禁止留默认值顶替）——见
#     docs/evidence/M0-reg-config.md 的逐键勾选表；
#   - 定稿时点晚于 M0 的键：本阶段以 `null` 占位 = **未定稿**（不代表取值未知）；
#   - `provisional` 仅适用于 §10.4 明列的代用数据项 —— 见
#     docs/evidence/M0-reg-provisional.md。
# 纪律：现场运行期**只允许**曝光/增益微调；其余取值由启动时选定，换值 = 改本文件后重启（§10.4、§8.1）。
# 生成时点：2026-09-18（M0 阶段，v3.28 首次落盘；v3.29 同步 O34/O30 裁定后的注释与口径，**键值零改动**）。
# 改动本文件后须同步回写 §10.4 与 §14（规则 00-ssot.md §4）。

# ── 硬件（定稿时点 M0）──────────────────────────────────────────────
board:
  model: "Embedfire LubanCat-5 V2"      # 实测 /proc/device-tree/model（M0-1）
  cam_port: "CAM0"                       # 丝印口；CAM0 = 4 lane（R12）
  cam_lanes: 4
  overlay: "rk3588-lubancat-5-cam0-imx415-1920x1080-60fps-overlay.dtbo"
                                         # uEnvLubanCat5-V2.txt 第 63 行启用；另有 HDMI0-VP0 与
                                         # DSI0-VP2 5.5" 1080x1920 两条 overlay 同时生效（未改动）

# ── 采集（定稿时点 M0）──────────────────────────────────────────────
camera:
  video_node: "/dev/video11"             # rkisp_mainpath，NV12 1920×1080（M0-1 实测）
  rkisp_node: "/dev/media1"              # rkisp0-vir0；口径已裁定（v3.29 裁定 O34-④）= ISP 的
                                         # media 设备（拓扑/子设备控制），采集出口见 camera.video_node
  mainpath_only: true                    # 只开 mainpath，勿开 rawpath（§3.1）
  mode_class: null                       # 定稿时点 M1（§3.2 三步实验）
  fps: null                              # 定稿时点 M1（§3.2；实测 ≈50.6 fps ≠ 30，30 fps 锁定留 M1）
  exposure_us: null                      # 定稿时点 M1（§3.2、§9.5）
  # `camera.gain_*`：§10.4 为**通配键名**（"实测重标结构"），**子键名未定** ⇒ 无法落盘
  # （禁止自造表外键，规则 20-contracts.md §1）。**v3.29 裁定 O34-③**：该行定稿时点 = **M1**
  # ⇒ 子键名随 M1 的 `v4l2-ctl -L` 实测一并定义；不参与 §11.2 M0-② 的判定

# ── ISP（定稿时点 M1）───────────────────────────────────────────────
isp:
  presets: null                          # 暗房 / 夜景 / 人脸（§9.2、§9.5）
  fingerprint: null                      # iq_file+iq_hash / gamma_table / ccm / black_level /
                                         # awb_lock / nr_2d / nr_3d / dpc（§9.5）
  csc_matrix: null                       # 定稿时点 M1（BT.601/709）
  rgb_range: null                        # 定稿时点 M1（limited/full）
  nr_3d_ref_frames: null                 # 定稿时点 M1

# ── 图像（定稿时点 M0）──────────────────────────────────────────────
rga:
  core_mask: 3                           # = IM_SCHEDULER_RGA3_CORE0 | CORE1（M0-13 实测落定）

# ── 显示（定稿时点 M0，除末项）──────────────────────────────────────
display:
  screen_plugin: "mipi600p"              # v3.33 变更（原 mipi1080p）：实物为 7" 1024×600 屏（STL7.0-60-132-K）
  dsi_connector: "DSI-1"                 # 自检比对用；CRTC/plane 一律运行时解析，禁止写死 crtc id
  hdmi_connector: "HDMI-A-1"             # 自检比对用；当前实测 disconnected（M0-9 需接显示器）
  mipi_canvas: [1024, 600]               # 内部合成画布（§3.4；v3.33 变更，横屏 7"）
  hdmi_canvas: [1920, 1080]              # 内部合成画布（§3.1 两层 SSOT 中的 buffer 尺寸）
  panel_refresh_hz: 60                   # 实测 1024x600p60（dclk 51668000；51668000/(1354×636)=60.00 Hz）
  mode_htotal: 1354                      # 实测 modetest #0：1024 1184 1194 1354（=1024+160+10+160）
  mode_vtotal: 636                       # 实测 modetest #0：600 612 613 636（=600+12+1+23）
  dsi_lane_rate: 344                     # Mbit/s/lane，dmesg 实测 "DSI-Link bandwidth: 344453 x 4 Kbps"
  hdmi_mode_selection: null              # 定稿时点 M2（EDID mode list 优先 1080p，无则 preferred）

# ── 链路（定稿时点见各行）───────────────────────────────────────────
pipeline:
  curve_level: "480x272"                 # 【provisional】§10.4 明列的代用数据项（O7），M1 实拍集复检转 final
                                         # 三档 shape 表 = 256x144 / 480x272 / 960x544，由本键与
                                         # curve_geometry 共同承载（§10.4 该行与 §3.1）
  curve_geometry:                        # 定稿时点 M0（§3.1 契约 G1；v3.27 裁定 O32 后的机制）
    effective:                           # 有效区（网络输出只取此区，pad 行丢弃）
      "256x144": [256, 144]
      "480x272": [480, 270]
      "960x544": [960, 540]
    pad_to:                              # 模型 shape（256×144 严格 16:9，无 pad）
      "256x144": [256, 144]
      "480x272": [480, 272]
      "960x544": [960, 544]
    pad_fill: "zero"                     # 零填充（v3.10 裁定 O20）
    pad_mechanism: "rga_improcess_zero_source_at_pool_init"
                                         # 缓冲池初始化时各填一次（0.45 ms/缓冲）+ 每帧一次
                                         # scale+CSC blit（不越写 pad 行）（v3.27 裁定 O32）
    output_take: "effective_only"
  curve_field_precision: "fp16"          # 【临时期值】v3.22 裁定 O23 = 全档 FP16；定稿时点 M2
  apply_scope: null                      # 定稿时点 M2（显示 = 512×288（v3.33 变更）；存盘 = 1920×1080）
  curve_upsample: null                   # 定稿时点 M2（bilinear_fused）
  est_freq_hz: null                      # 定稿时点 M2（与 f_est 联动）
  ema_alpha: null                        # 定稿时点 M2（N = ln0.1/lnα）

# ── HQ（定稿时点 M0，缺 3 项）───────────────────────────────────────
hq:
  model_id: null                         # ❌ 空缺：依赖 O30（v3.29 裁定为「暂时挂起」）⇒ 保持空缺，
                                         # 不得以默认值顶替；重启条件见 §15 O30
  shape_ladder: ["960x544", "768x432", "512x288"]
  active_shape: null                     # ❌ 空缺：M0-4 三档 R9 闸口当天定版（现为占位，O30 暂挂）
  pad_crop_policy: null                  # ❌ 空缺：随 active_shape 一并定版（同上）
  hold_policy: null                      # 定稿时点 M3（replace_and_hold）
  fade_ms: null                          # 定稿时点 M3（300）
  mipi_preview_ms: null                  # 定稿时点 M3（2500）
  mipi_preview_rect: null                # 定稿时点 M3（512×288；X 512–1023，Y 0–287）（v3.33 变更）

# ── 触发（定稿时点 M1）─────────────────────────────────────────────
trigger:
  sources: null                          # 触控 / GPIO / 定时 / 串口（§8.1）
  debounce_ms: null                      # 定稿时点 M1（50）
  interval_s: null                       # 定稿时点 M1（8；3~30 可配）

# ── UI（定稿时点 M2）───────────────────────────────────────────────
ui:
  button_layout: null                    # 3 键单行，行高 96 px，各 341 px（v3.33 由 6 键三行精简）
  hit_area_min_px: null                  # 67（v3.33 变更，原 160；同为 ≈10 mm @170 PPI）
  reset_hold_ms: null                    # 3000（v3.14 裁定 O6）
  osd_metrics_px: null                   # 216（v3.33 新增：OSD 指标区总高）
  osd_status_row_px: null                # 36（v3.33 新增：状态/数值行高）
  osd_plot_px: null                      # [512, 180]（v3.33 新增：曲线图与直方图各占）
  osd_status_fields: null                # v3.35：状态行 8 字段与顺序（mode/fps/latency/curve_hz/countdown/mean_orig/mean_enh/dmean）
  osd_stats_decimate: null               # v3.35：统计降采样率 4（512×288 → 128×72）
  osd_stats_hz: null                     # v3.35：统计更新频率 1 Hz
  osd_font_px: null                      # 36/26

# ── 计量（定稿时点 M1/M2）──────────────────────────────────────────
metrics:
  window_frames: null                    # 定稿时点 M1（≥300 帧滑动窗）
  timestamp_domain: null                 # 定稿时点 M1（MONOTONIC）
  timestamp_source: null                 # 定稿时点 M1（SOE / EOF，须随报告注明）
  pair_by: null                          # 定稿时点 M1（seq；禁止按时间就近配对）
  report_breakdown: null                 # 定稿时点 M2（延迟两段分解随报告给出）
  idle_link_baseline: null               # 定稿时点 M1（空链路 P50/P95；O19 的触发依据）

# ── 存储（定稿时点 M3）─────────────────────────────────────────────
storage:
  dir: null
  name_pattern: null                     # {seq_src}_{mono_ns}_{utc}_{model_id}_{curve_level}_{item}
  image_format: null                     # png8_rgb
  meta_carrier: null                     # json_sidecar + png_text
  capacity_limit_gb: null                # 依赖 O21（介质与容量实测）
  retention: null                        # ring_overwrite_oldest（按 seq_src 整组淘汰）

# ── 模型（定稿时点 M0/M1）──────────────────────────────────────────
model:
  zde_weight_hash: "ca8855b90df9a80fa4195a831f33d3476b1964f787eb70602797c773067f3b84"
                                         # 权重本体（Epoch99.pth）sha256；≠ .rknn 文件哈希
                                         # （.rknn 非 byte-reproducible，§10.2）
  zde_output_channels: 3                 # 模型契约
  zde_output_layout: "NCHW"              # rknn_query 实测（= tools/rknn_c_probe.c 的 out_attr.fmt）
  zde_output_dims: [1, 3, 272, 480]      # rknn_query 实测（480×272 档）
  zde_ft_version: "none"                 # 当前权重 = 官方 Epoch99.pth，未做实拍域 fine-tune；
                                         # M1 按 O11 计划（权重变更即全量重跑）
  hq_fallback_id: null                   # ❌ 空缺：依赖 O30（v3.29 裁定为「暂时挂起」）⇒ 保持空缺

# ── 运行时（定稿时点 M0）───────────────────────────────────────────
runtime:
  toolkit2_ver: "2.3.2"                  # 与 librknnrt 同版本号（§2.2）
  librknnrt_ver: "2.3.2"
  rknpu_driver_ver: "0.9.8"              # ≥ 0.9.2 下限即可（非"三者同版"）

# ── 工程（定稿时点 M2）─────────────────────────────────────────────
logging:
  level: null
  dir: null
  rotate_mb: null
  keep_files: null